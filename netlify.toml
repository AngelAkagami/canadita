[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------- caché
# /_astro: nombres con hash de contenido → caché permanente.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes: cambian solo si se cambia de archivo (nombre nuevo).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos, logos, ornamentos y texturas: no llevan hash, así que en vez de
# "immutable" se guardan 30 días y, al vencer, se sirven de caché mientras
# se revalidan en segundo plano (si se reemplaza una foto con el mismo
# nombre, el cambio llega sin dejar a nadie con la versión vieja un año).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/logo-*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/ornamento-*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

# Service worker: siempre fresco para que las versiones nuevas se instalen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
